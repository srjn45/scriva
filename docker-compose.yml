services:
  scriva:
    build: .
    image: ghcr.io/srjn45/scriva:dev
    container_name: scriva
    restart: unless-stopped
    ports:
      - "5433:5433"   # gRPC (TCP)
      - "8080:8080"   # REST gateway
    environment:
      # API key for both gRPC and REST; clients must send the same value.
      SCRIVA_API_KEY: ${SCRIVA_API_KEY:-dev-key}
    # The image entrypoint binds 0.0.0.0:5433 (gRPC) and 0.0.0.0:8080 (REST);
    # the server refuses to start that way without an API key or TLS.
    volumes:
      - scriva-data:/data

volumes:
  scriva-data:
